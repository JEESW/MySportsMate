<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>공지사항 상세</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>


<body>

<div class="container mt-5">

    <div class="card">

        <div class="card-header">
            <h3 th:text="${result.noticeTitle}">
                공지 제목
            </h3>
        </div>


        <div class="card-body">

            <div class="mb-3">
                <strong>작성자</strong>
                <span th:text="${result.regit}">
                    user01
                </span>
            </div>


            <div class="mb-3">
                <strong>작성일</strong>
                <span th:text="${result.createDate}">
                    2026-08-02
                </span>
            </div>


            <hr>


            <div class="mb-4">

                <p th:text="${result.noticeContent}">
                    공지 내용입니다.
                </p>

            </div>


            <div class="text-end">

                <a href="/board/notice/list"
                   class="btn btn-secondary">
                    목록
                </a>


                <a th:href="@{/board/notice/{id}/edit(id=${result.id})}"
                   class="btn btn-primary">
                    수정
                </a>


                <button class="btn btn-danger">
                    삭제
                </button>

            </div>

        </div>

    </div>

</div>

</body>

</html>
