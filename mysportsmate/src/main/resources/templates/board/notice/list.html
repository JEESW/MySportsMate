<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>공지사항</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>


<body>

<div class="container mt-5">


    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1>공지사항</h1>

        <a href="/board/notice/write"
           class="btn btn-primary">
            글쓰기
        </a>

    </div>


    <table class="table table-hover">


        <thead class="table-light">

        <tr>
            <th>번호</th>
            <th>제목</th>
            <th>작성자</th>
            <th>등록일</th>
        </tr>

        </thead>


        <tbody>


        <tr th:each="notice : ${list}">


            <td th:text="${notice.id}">
                1
            </td>


            <td>
                <a th:href="@{/board/notice/{id}(id=${notice.id})}"
                   class="text-decoration-none"
                   th:text="${notice.noticeTitle}">
                    공지 제목
                </a>
            </td>


            <td th:text="${notice.regit}">
                작성자
            </td>


            <td th:text="${notice.createAt}">
                2026-08-02
            </td>


        </tr>


        <tr th:if="${#lists.isEmpty(list)}">

            <td colspan="4"
                class="text-center">
                등록된 공지사항이 없습니다.
            </td>

        </tr>


        </tbody>


    </table>


</div>


</body>

</html>
